<!doctype html>
<html lang="en" data-theme="dark" data-accent="cyan" data-text="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AccessFromPhone</title>
<meta name="description" content="Ask your PC to do things from your phone. You approve every change.">
<meta name="theme-color" content="#060b16" id="themeColor">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Access">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<script>
// Apply the saved look before the first paint, so the page never flashes the wrong theme.
(function () {
  try {
    var s = JSON.parse(localStorage.getItem("afp_settings") || "{}"), r = document.documentElement;
    var dark = s.theme === "dark" || (s.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) || !s.theme;
    r.dataset.theme = dark ? "dark" : "light";
    if (s.accent) r.dataset.accent = s.accent;
    if (s.text) r.dataset.text = s.text;
    if (s.reduceMotion) r.dataset.motion = "off";
  } catch (e) {}
})();
</script>
<script>
// The opening animation plays on every launch; tests and anyone who wants it off can set afp_splash_off.
(function () {
  try {
    if (localStorage.getItem("afp_splash_off") === "1") document.documentElement.dataset.splash = "off";
    // once per launch: a reload, a reconnect or coming back to the app does not replay it (a session lasts until the app or tab is closed)
    else if (sessionStorage.getItem("afp_splash_seen") === "1") document.documentElement.dataset.splash = "off";
    else sessionStorage.setItem("afp_splash_seen", "1");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="sp-center">
    <svg class="sp-mark" viewBox="0 0 80 80" width="92" height="92" focusable="false"><circle class="sp-ring" cx="40" cy="40" r="32" pathLength="100"/><circle class="sp-core" cx="40" cy="40" r="10"/></svg>
    <div class="sp-word"><span style="--i:0">A</span><span style="--i:1">C</span><span style="--i:2">C</span><span style="--i:3">E</span><span style="--i:4">S</span><span style="--i:5">S</span></div>
    <p class="sp-tag">Your PC, from your pocket.</p>
    <p class="sp-sub">Ask in plain words. You approve every change.</p>
  </div>
  <div class="sp-bar"><i></i></div>
  <p class="sp-foot">Private · runs on your own PC</p>
</div>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Chats"></aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="offline" id="offline" role="status" hidden>
      <span class="spin" aria-hidden="true"></span><span id="offlineText">Can't reach your PC. Retrying&hellip;</span><button class="offline-retry" id="offlineRetry" type="button">Try now</button>
    </div>
    <header class="top" id="top"></header>
    <section class="home" id="home" aria-label="Home" hidden></section>
    <div class="saved-bar" id="savedBar" role="status" hidden></div>

    <section class="scroller" id="scroller" aria-live="polite">
      <div class="thread" id="thread"></div>
    </section>
    <button class="jump" id="jump" type="button" aria-label="Jump to the latest message" hidden></button>

    <footer class="dock" id="dock"></footer>
    <div class="dlbar" id="dlbar" hidden></div>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </main>

  <aside class="canvas" id="canvas" aria-label="Open file" hidden></aside>
</div>

<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#e6f1ff">AccessFromPhone needs JavaScript.</p></noscript>
<script src="/static/conn.js" defer></script>
<script src="/static/offline.js" defer></script>
<script src="/static/app.js" defer></script>
</body>
</html>
